# Ejecutar desde la raíz del repo (schedule-maker):
#   docker compose up -d
#   docker compose restart backend
# API: http://localhost:8000  Docs: http://localhost:8000/docs

services:
  backend:
    build: ./backend
    image: schedule-maker-backend
    container_name: schedule_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/code/app
      - ./data:/code/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SCHEDULE_DATA_DIR=/code/data
      - SCHEDULE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: schedule_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  db:
    image: postgres:15-alpine
    container_name: schedule_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=schedule_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  redisdata:
